{% extends "base.html" %}


{% block title %}
	<title>Driver List</title>
{% endblock %}


{% block content %}
	<h1>Driver List</h1>
    <ul>
      {% for driver in driver_list %}
      	    <li>
              <a href="{% url 'taxi:driver-detail' driver.id %}">
                {{ driver.username }}
              </a>
            </li>
      {% endfor %}
    </ul>
{% endblock %}
