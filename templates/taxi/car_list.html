{% extends "base.html" %}

{% block title %}
	<title>Car list</title>
{% endblock %}

{% block content %}
	<h1>Car List</h1>
  <ul>
    {% for car in car_list %}
  	  <li>
        <a href="{% url 'taxi:car-detail' car.id %}">
          {{ car.id }}
        </a>
        - {{ car.model }}
        <br>
        Manufacturer - {{ car.manufacturer.name }}
        <hr>
      </li>

    {% endfor %}
  </ul>
{% endblock %}
